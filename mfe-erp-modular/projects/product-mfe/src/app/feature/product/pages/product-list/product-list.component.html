<div class="flex flex-col p-4">
  <div class="grid grid-cols-1 md:grid-cols-2 mb-4">
    <div class="text-2xl">Productos</div>
    <div class="flex justify-end">
      <p-button
        label="Nuevo producto"
        icon="pi pi-plus"
        (onClick)="productCreateVisible.set(true)"
      />
    </div>
  </div>
  <div class="w-full">
    <app-product-list-table [products]="products()" />
  </div>
</div>
<app-product-create [(visible)]="productCreateVisible" (created)="onCreated()" />
