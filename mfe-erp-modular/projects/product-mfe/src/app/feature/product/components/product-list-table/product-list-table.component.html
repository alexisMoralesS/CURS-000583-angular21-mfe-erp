<p-table [value]="products()" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>Codigo</th>
      <th>Producto</th>
      <th>Categoria</th>
      <th>Marca</th>
      <th>Precio</th>
      <th>Stock Mínimo</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-product>
    <tr>
      <td>{{ product.code }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.category.name }}</td>
      <td>{{ product.brand.name }}</td>
      <td>{{ product.price }}</td>
      <td>{{ product.minStock }}</td>
      <td>
        <div class="flex gap-2">
          <p-button icon="pi pi-pen-to-square" outlined severity="warn" />
          <p-button icon="pi pi-trash" outlined severity="danger" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
