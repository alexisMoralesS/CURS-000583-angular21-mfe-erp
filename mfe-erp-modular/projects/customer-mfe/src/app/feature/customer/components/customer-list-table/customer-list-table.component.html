<p-table [value]="customers()" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>Cliente</th>
      <th>Documento</th>
      <th>Teléfono</th>
      <th>Email</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-customer>
    <tr>
      <td>{{ customer.name }}</td>
      <td>{{ customer.documentType.id + ':' + customer.numberDocument }}</td>
      <td>{{ customer.phone }}</td>
      <td>{{ customer.email }}</td>
      <td>
        <div class="flex gap-2">
          <p-button icon="pi pi-pen-to-square" outlined severity="warn" />
          <p-button icon="pi pi-trash" outlined severity="danger" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
